<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#f6f5f2" />
		<script>
			// Stamp the theme before first paint so there's no flash of the wrong
			// palette. Light is the default and dark is opt-in via the nav
			// toggle; the prefers-color-scheme rule in app.css only covers the
			// no-JS case, where nothing stamps data-theme at all. Kept in sync
			// with $lib/theme.svelte.ts, which takes over once the app hydrates.
			try {
				var theme = localStorage.getItem('theme') || 'light';
				document.documentElement.dataset.theme = theme;
				document
					.querySelector('meta[name="theme-color"]')
					.setAttribute('content', theme === 'dark' ? '#1a1b26' : '#f6f5f2');
			} catch (e) {
				document.documentElement.dataset.theme = 'light';
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
