<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script>
			// Set the theme + swap before first paint to avoid a flash of the wrong palette.
			(() => {
				try {
					const themes = ['milk-sea', 'arch-paper', 'straw-berry'];
					const stored = localStorage.getItem('theme');
					const theme = themes.includes(stored) ? stored : 'milk-sea';
					const swap = localStorage.getItem('theme-swap') === 'true';
					document.documentElement.dataset.theme = theme;
					document.documentElement.dataset.swap = String(swap);
				} catch {
					document.documentElement.dataset.theme = 'milk-sea';
					document.documentElement.dataset.swap = 'false';
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
